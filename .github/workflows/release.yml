#
# Publishes a GitHub Release when a vX.Y.Z[-pre] tag is pushed: runs the whole
# of CI on the tag, checks the tag equals v<VERSION>, and creates the Release
# with that version's CHANGELOG.md section as its notes and the merged SBOM
# attached. A tag with a pre-release suffix creates a pre-release. See
# docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    # The only job that writes: it creates the Release and uploads the SBOM.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag matches VERSION and CHANGELOG.md
        run: python3 scripts/release.py check --tag "$TAG"
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "$TAG" > release-notes.md
      # The sbom job in ci.yml uploaded it earlier in this same run.
      - name: Fetch the SBOM
        run: gh run download "$GITHUB_RUN_ID" --name sbom --dir sbom
      - name: Create the release
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag \
            --title "World Model Inference $TAG" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            sbom/world-model-inference.cdx.json
