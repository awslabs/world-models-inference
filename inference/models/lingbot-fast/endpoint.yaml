# LingBot-World-Fast — 8-GPU video generation
# Upstream: https://github.com/robbyant/lingbot-world
# Weights:
#   - robbyant/lingbot-world-base-cam   (base model, ~60GB)
#   - robbyant/lingbot-world-fast       (KV-cached fast head, overlay onto base)
# Compute target: p5.48xlarge (8 x H100 80GB). Matches upstream --nproc_per_node=8 --ulysses_size 8.

model_data: s3://world-model-accelerator-artifacts-${AWS_ACCOUNT_ID}/lingbot-fast/
version: 0.1.0

# Built by the shared inference/Dockerfile.default (no per-model Dockerfile).
# Base pinned to an NGC image with torch 2.4 / CUDA 12.6 / Python 3.10, which has
# a matching prebuilt flash-attn wheel. requirements.txt pins numpy<2, so we keep
# the default --no-deps so pip can't swap the CUDA-matched torch the base ships.
base_image: nvcr.io/nvidia/pytorch:24.08-py3
# {ABI} is replaced with TRUE/FALSE at build time from the installed torch.
flash_attn_wheel: https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.4cxx11abi{ABI}-cp310-cp310-linux_x86_64.whl

sagemaker:
  instance: ml.p5.48xlarge
  scale: { min: 0, max: 2 }
  output: s3://world-model-accelerator-outputs-${AWS_ACCOUNT_ID}/lingbot-fast/

hf:
  - { repo: robbyant/lingbot-world-base-cam, subdir: "" }
  - { repo: robbyant/lingbot-world-fast,     subdir: "lingbot_world_fast" }

mode: async

ec2:
  instance: p5.48xlarge
  volume_size: 500

# --- Weights licence ---------------------------------------------------------
# Verified 2026-09-21: both weight repos are tagged apache-2.0 on HF. The 53
# vendored upstream files under wan/ are Apache-2.0 too (UPSTREAM_LICENSE.txt).
license: Apache-2.0
license_url: https://huggingface.co/robbyant/lingbot-world-fast
license_restricted: false
