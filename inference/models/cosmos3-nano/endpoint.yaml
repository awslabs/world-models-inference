# Cosmos3-Nano — omnimodal world model (video gen, world sim, action policy)
# Upstream: https://github.com/NVIDIA/Cosmos
# Weights: nvidia/Cosmos3-Nano on HuggingFace (~32GB, open — no token required)
# Compute target: g6e.12xlarge (4×L40S) for single/multi-GPU. p5.48xlarge for max speed.

model_data: s3://world-model-accelerator-artifacts-${AWS_ACCOUNT_ID}/cosmos3-nano/
version: 0.1.0

sagemaker:
  instance: ml.g6e.12xlarge
  scale: { min: 0, max: 2 }
  output: s3://world-model-accelerator-outputs-${AWS_ACCOUNT_ID}/cosmos3-nano/

hf:
  - { repo: nvidia/Cosmos3-Nano, subdir: "" }

ec2:
  instance: g6e.12xlarge
  volume_size: 200

