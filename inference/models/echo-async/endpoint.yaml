# Echo async test endpoint

model_data: s3://world-model-accelerator-artifacts-${AWS_ACCOUNT_ID}/echo-async/
version: 0.1.1

sagemaker:
  instance: ml.g5.2xlarge
  scale: { min: 0, max: 1 }
  output: s3://world-model-accelerator-outputs-${AWS_ACCOUNT_ID}/echo-async/

ec2:
  instance: g5.2xlarge

# --- GPU requirement (read by scripts/capacity.py) -------------------------
# test fixture: any GPU
gpu_count: 1
gpu_memory_gb: 0

# --- Weights licence ---------------------------------------------------------
# No third-party weights: this is our own test fixture, Apache-2.0 like the repo.
license: Apache-2.0
license_url: https://github.com/awslabs/world-models-inference
license_restricted: false
