# Echo real-time test endpoint

model_data: s3://world-model-accelerator-artifacts-${AWS_ACCOUNT_ID}/echo-realtime/
version: 0.1.0

sagemaker:
  instance: ml.g5.2xlarge
  scale: { min: 0, max: 10 }
  max_concurrent: 1   # stateful (position) — one user per container

ec2:
  instance: g5.12xlarge

# --- GPU requirement (read by scripts/capacity.py) -------------------------
# test fixture: four ranks, any GPU
gpu_count: 4
gpu_memory_gb: 0

# --- Weights licence ---------------------------------------------------------
# No third-party weights: this is our own test fixture, Apache-2.0 like the repo.
license: Apache-2.0
license_url: https://github.com/awslabs/world-models-inference
license_restricted: false
