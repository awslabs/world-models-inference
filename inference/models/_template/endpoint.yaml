# Template cartridge — copy this directory to inference/models/<your-id>/
#
# The leading underscore keeps it out of `./deploy.sh list`; it is a scaffold,
# not a deployable model.
#
# Minimum for a new model: this file, runner.py, requirements.txt.
# No Dockerfile needed — inference/Dockerfile.default builds it.

# Where staged weights live in S3. ${AWS_ACCOUNT_ID} is substituted at deploy time.
model_data: s3://world-model-accelerator-artifacts-${AWS_ACCOUNT_ID}/CHANGE-ME/
version: 0.1.0

# --- Build (all optional; only read when using the shared Dockerfile) ---------
# Pin a base image whose torch/CUDA suits your model. Default:
# nvcr.io/nvidia/pytorch:24.01-py3
# base_image: nvcr.io/nvidia/pytorch:24.08-py3
#
# Install requirements WITH transitive deps. Default is --no-deps so pip can't
# swap the CUDA-matched torch the NGC base ships. Set to 0 if you need resolution.
# pip_no_deps: 0
#
# Prebuilt flash-attn wheel. Must match the base image's torch/CUDA/Python.
# Use {ABI} where the C++11-ABI flag goes — it's filled in at build time.
# flash_attn_wheel: https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.4cxx11abi{ABI}-cp310-cp310-linux_x86_64.whl

# --- Weights to stage from Hugging Face --------------------------------------
# Then run: python scripts/stage-weights.py <your-id> --source hf:<org>/<repo>
hf:
  - { repo: CHANGE-ME/your-model, subdir: "" }

# async = request/poll job (video, 3D). real-time = stateful WebSocket session.
mode: async

# --- Deploy targets ----------------------------------------------------------
ec2:
  instance: g6e.2xlarge     # smallest GPU that fits your model
  volume_size: 200          # GB; must exceed your weights

sagemaker:
  instance: ml.g6e.2xlarge
  scale: { min: 0, max: 1 }
  output: s3://world-model-accelerator-outputs-${AWS_ACCOUNT_ID}/CHANGE-ME/

# --- Weights licence (REQUIRED) ----------------------------------------------
# Find the real licence before you fill this in. Check the Hugging Face model
# card AND its API (https://huggingface.co/api/models/<repo>): a `license: other`
# tag means you must read `license_name`/`license_link`, because "other" is not a
# licence. The upstream *code* licence is often different from the weights.
#
# Set license_restricted: true for anything non-commercial, research-only, or
# unlicensed — deploy.sh then requires the operator to acknowledge the terms.
# Record the result in docs/MODEL_LICENSES.md; tests/test_model_licenses.py fails
# if you don't.
license: CHANGE-ME
license_url: https://huggingface.co/CHANGE-ME/your-model
license_restricted: false
# Optional: one line naming the ACTUAL restriction, shown by deploy.sh's gate.
# Only meaningful with license_restricted: true. Omit it and the gate prints a
# generic "read the license" line instead of asserting something possibly untrue.
# license_note: Non-commercial use only; derivatives must keep the same license.
