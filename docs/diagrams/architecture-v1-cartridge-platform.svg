<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7131F"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#277116"/></marker>
  </defs>
  <rect width="1560" height="900" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#232F3E">World Model Inference on AWS</text>
  <text x="40" y="66" font-size="13" font-style="italic" fill="#666">One parameterised stack. Models are interchangeable cartridges — adding one is adding a directory, not new infrastructure.</text>

  <!-- left column -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="40" y="150" width="150" height="48" rx="8" fill="#232F3E"/><text x="115" y="179" fill="#fff" font-weight="600">Developer</text>
    <rect x="40" y="250" width="150" height="44" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/><text x="115" y="277" fill="#232F3E" font-weight="700">./deploy.sh</text>
    <rect x="40" y="470" width="150" height="52" rx="8" fill="#fff" stroke="#147EBA" stroke-width="2"/><text x="115" y="491" fill="#147EBA">Catalogue UI</text><text x="115" y="508" fill="#147EBA">localhost:3000</text>
  </g>

  <!-- AWS cloud -->
  <rect x="240" y="96" width="1290" height="784" rx="10" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="256" y="116" font-size="13" font-weight="700" fill="#232F3E">AWS Cloud · Region</text>

  <!-- Build group -->
  <rect x="268" y="140" width="360" height="150" rx="8" fill="#FFF7EF" stroke="#D86613"/><text x="284" y="160" font-size="12" font-weight="700" fill="#D86613">Build (CodeBuild)</text>
  <g font-size="12" text-anchor="middle" fill="#232F3E">
    <rect x="286" y="180" width="150" height="90" rx="6" fill="#fff" stroke="#D86613"/><text x="361" y="220">CodeBuild</text><text x="361" y="238">container image</text>
    <rect x="460" y="180" width="150" height="90" rx="6" fill="#fff" stroke="#D86613"/><text x="535" y="220">CodeBuild</text><text x="535" y="238">model weights</text>
  </g>

  <!-- Storage group -->
  <rect x="648" y="140" width="360" height="150" rx="8" fill="#F2F9F0" stroke="#277116"/><text x="664" y="160" font-size="12" font-weight="700" fill="#277116">Storage</text>
  <g font-size="12" text-anchor="middle" fill="#232F3E">
    <rect x="666" y="180" width="108" height="90" rx="6" fill="#fff" stroke="#277116"/><text x="720" y="228">ECR image</text>
    <rect x="784" y="180" width="108" height="90" rx="6" fill="#fff" stroke="#277116"/><text x="838" y="220">S3 artifacts</text><text x="838" y="238">(weights)</text>
    <rect x="900" y="180" width="90" height="90" rx="6" fill="#fff" stroke="#277116"/><text x="945" y="228">S3 logs</text>
  </g>

  <!-- Control group (incl Cognito) -->
  <rect x="1028" y="140" width="484" height="150" rx="8" fill="#FDF3F3" stroke="#C7131F"/><text x="1044" y="160" font-size="12" font-weight="700" fill="#C7131F">Control plane</text>
  <g font-size="12" text-anchor="middle" fill="#232F3E">
    <rect x="1046" y="180" width="104" height="90" rx="6" fill="#fff" stroke="#C7131F"/><text x="1098" y="220">IAM</text><text x="1098" y="238">3 scoped roles</text>
    <rect x="1160" y="180" width="112" height="90" rx="6" fill="#fff" stroke="#C7131F"/><text x="1216" y="214">Systems Mgr</text><text x="1216" y="232">config</text><text x="1216" y="250">registry</text>
    <rect x="1282" y="180" width="120" height="90" rx="6" fill="#fff" stroke="#C7131F" stroke-width="2.5"/><text x="1342" y="214" font-weight="700">Amazon</text><text x="1342" y="232" font-weight="700">Cognito</text><text x="1342" y="250" font-size="10.5">access tokens</text>
    <rect x="1412" y="180" width="86" height="90" rx="6" fill="#fff" stroke="#C7131F"/><text x="1455" y="228">CloudWatch</text>
  </g>

  <!-- VPC -->
  <rect x="268" y="330" width="1244" height="520" rx="8" fill="none" stroke="#147EBA" stroke-width="1.5"/>
  <text x="284" y="352" font-size="12" font-weight="700" fill="#147EBA">VPC · 2 availability zones</text>

  <!-- public subnet -->
  <rect x="286" y="372" width="200" height="440" rx="8" fill="#EAF3FB" stroke="#147EBA"/><text x="300" y="392" font-size="11.5" font-weight="700" fill="#147EBA">Public subnet</text>
  <rect x="312" y="430" width="150" height="88" rx="6" fill="#fff" stroke="#147EBA" stroke-width="2"/>
  <g font-size="12" text-anchor="middle" fill="#232F3E"><text x="387" y="462" font-weight="600">Application</text><text x="387" y="480">Load Balancer</text><text x="387" y="500" font-size="10.5">only public entry</text></g>
  <rect x="312" y="700" width="150" height="60" rx="6" fill="#fff" stroke="#147EBA"/><text x="387" y="735" font-size="12" text-anchor="middle" fill="#232F3E">NAT gateway</text>

  <!-- private subnet -->
  <rect x="506" y="372" width="988" height="440" rx="8" fill="#EEF6FC" stroke="#147EBA"/><text x="520" y="392" font-size="11.5" font-weight="700" fill="#147EBA">Private subnet · no public IP</text>
  <rect x="540" y="420" width="470" height="120" rx="8" fill="#fff" stroke="#232F3E" stroke-width="1.5"/>
  <g font-size="12.5" text-anchor="middle" fill="#232F3E"><text x="775" y="456" font-weight="700">EC2 GPU instance</text><text x="775" y="480" font-size="12">torchrun — rank 0 serves FastAPI :8080</text><text x="775" y="500" font-size="12">ranks 1..N-1 follow in lockstep</text></g>
  <rect x="540" y="580" width="920" height="200" rx="8" fill="#F7FAFE" stroke="#147EBA" stroke-dasharray="4 3"/>
  <text x="560" y="604" font-size="12" font-weight="700" fill="#147EBA">Interchangeable model cartridges</text>
  <g font-size="12" fill="#232F3E">
    <text x="560" y="636">• LingBot Fast (8× H100)</text><text x="560" y="662">• Cosmos 3 Nano (4× L40S)</text><text x="560" y="688">• Matrix Game 3 — real-time (8× H100)</text>
    <text x="1010" y="636">• Waypoint 1.5 — real-time (1× H100)</text><text x="1010" y="662">• V-JEPA 2-AC (1× L40S)</text><text x="1010" y="688">• Lyra 2 (1× H100)  + 2 test cartridges</text>
  </g>
  <text x="560" y="726" font-size="11" font-style="italic" fill="#5a6b7a">one directory each — a manifest + a runner class; no infrastructure code changes</text>

  <!-- S3 gateway endpoint -->
  <rect x="1130" y="420" width="330" height="120" rx="8" fill="#F2F9F0" stroke="#277116" stroke-dasharray="4 3"/>
  <text x="1295" y="470" font-size="12" text-anchor="middle" fill="#277116" font-weight="600">S3 gateway endpoint</text><text x="1295" y="492" font-size="11.5" text-anchor="middle" fill="#277116">weights sync stays on the private network</text>

  <!-- edges -->
  <g stroke="#232F3E" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="115" y1="198" x2="115" y2="248"/>                 <!-- dev->deploy -->
    <line x1="190" y1="272" x2="284" y2="230"/>                 <!-- deploy->build -->
    <line x1="436" y1="200" x2="700" y2="200" opacity="0"/>     <!-- spacing -->
    <line x1="436" y1="215" x2="662" y2="220"/>                 <!-- image cb -> ecr -->
    <line x1="535" y1="270" x2="820" y2="292" opacity="0"/>
    <line x1="486" y1="474" x2="536" y2="474"/>                 <!-- ALB -> EC2 :8080 -->
  </g>
  <text x="510" y="466" font-size="10" text-anchor="middle" fill="#232F3E">:8080</text>

  <!-- dashed control/auth edges -->
  <g stroke="#C7131F" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)">
    <line x1="1342" y1="270" x2="900" y2="450"/>               <!-- Cognito -> EC2 -->
    <line x1="1216" y1="270" x2="880" y2="430"/>               <!-- SSM config -> EC2 -->
  </g>
  <text x="1150" y="360" font-size="10.5" fill="#C7131F">Cognito verifies access token (JWKS)</text>
  <text x="1150" y="376" font-size="10.5" fill="#C7131F">SSM supplies non-secret config</text>

  <!-- weights sync + vite proxy -->
  <g stroke="#277116" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ag)">
    <line x1="1130" y1="480" x2="1012" y2="480"/>              <!-- gateway -> cartridge/EC2 -->
    <line x1="838" y1="270" x2="820" y2="418"/>                <!-- S3 artifacts -> EC2 weights -->
  </g>
  <g stroke="#147EBA" stroke-width="1.6" fill="none" stroke-dasharray="5 4">
    <path d="M190,496 C 240,496 250,474 310,474" marker-end="url(#a)"/>  <!-- UI -> ALB via proxy -->
  </g>
  <text x="212" y="446" font-size="10" fill="#147EBA">vite proxy · token server-side</text>

  <text x="40" y="596" font-size="11.5" fill="#666">SageMaker is an optional</text>
  <text x="40" y="612" font-size="11.5" fill="#666">alternate deploy target</text>
  <text x="40" y="628" font-size="11.5" fill="#666">(same image + weights).</text>
</svg>
